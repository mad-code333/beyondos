<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Supply cards size match</title>
    <link rel="stylesheet" href="../src/components/home/ecosystem/ecosystem-stories.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        font-family: Manrope, Inter, system-ui, sans-serif;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        gap: 14px;
      }
      .slot {
        position: relative;
        width: 200px;
        aspect-ratio: 337 / 353;
      }
      .eco-story-arrow {
        position: absolute;
        top: 50%;
        right: -20px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-top: -13px;
        border-radius: 50%;
        color: #d7c7ff;
        background: rgba(10, 8, 16, 0.92);
        border: 1px solid rgba(178, 92, 255, 0.85);
        box-shadow:
          0 0 0 4px rgba(5, 5, 8, 0.85),
          0 0 16px rgba(178, 92, 255, 0.35);
      }
      .eco-story-arrow.is-off {
        color: rgba(167, 139, 250, 0.55);
        border-color: rgba(167, 139, 250, 0.45);
        box-shadow: 0 0 0 4px rgba(5, 5, 8, 0.85);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="slot">
        <div class="eco-supply-card is-lit is-active" data-shot="list">
          <div class="eco-supply-media" aria-hidden="true">
            <img class="eco-supply-shot" src="../public/media/supply-01-art.png" alt="" />
            <span class="eco-supply-orbit-pulse"></span>
          </div>
          <span class="eco-supply-index">01</span>
          <span class="eco-supply-status is-on">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
              <circle cx="10" cy="10" r="9" fill="currentColor" />
              <path d="m6.2 10.2 2.4 2.4 5.2-5.2" stroke="#120816" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div class="eco-supply-copy">
            <strong>List what's needed</strong>
            <span>Food · linen · amenities.</span>
          </div>
          <a class="eco-supply-cta" href="#">Explore categories →</a>
        </div>
        <i class="eco-story-arrow">→</i>
      </div>
      <div class="slot">
        <div class="eco-supply-card" data-shot="order">
          <div class="eco-supply-media" aria-hidden="true">
            <img class="eco-supply-shot" src="../public/media/supply-02-art.png" alt="" />
            <span class="eco-supply-orbit-pulse"></span>
          </div>
          <span class="eco-supply-index">02</span>
          <span class="eco-supply-status">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
              <circle cx="10" cy="10" r="8.2" stroke="currentColor" stroke-width="1.4" />
            </svg>
          </span>
          <div class="eco-supply-copy">
            <strong>Place one order</strong>
            <span>Unified procurement.</span>
          </div>
          <a class="eco-supply-cta" href="#">Explore categories →</a>
        </div>
        <i class="eco-story-arrow is-off">→</i>
      </div>
      <div class="slot">
        <div class="eco-supply-card" data-shot="receive">
          <div class="eco-supply-media" aria-hidden="true">
            <img class="eco-supply-shot" src="../public/media/supply-03-art.png" alt="" />
            <span class="eco-supply-orbit-pulse"></span>
          </div>
          <span class="eco-supply-index">03</span>
          <span class="eco-supply-status">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
              <circle cx="10" cy="10" r="8.2" stroke="currentColor" stroke-width="1.4" />
            </svg>
          </span>
          <div class="eco-supply-copy">
            <strong>Receive supplies</strong>
            <span>Stock ready.</span>
          </div>
          <a class="eco-supply-cta" href="#">Explore categories →</a>
        </div>
      </div>
    </div>
  </body>
</html>

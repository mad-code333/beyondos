<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Supply cards preview</title>
    <link rel="stylesheet" href="../src/components/home/ecosystem/ecosystem-stories.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        font-family: Manrope, Inter, system-ui, sans-serif;
      }
      .eco-story-flow {
        display: grid;
        grid-template-columns: repeat(3, 240px);
        gap: 24px;
        width: auto;
        margin: 0;
      }
      .eco-story-node--supply {
        position: relative;
        opacity: 1;
        padding: 0;
        border: none;
        background: transparent;
        box-shadow: none;
      }
      .eco-story-node-visual {
        width: 240px;
        aspect-ratio: 382 / 256;
      }
      .eco-story-arrow {
        position: absolute;
        top: 50%;
        right: -25px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-top: -13px;
        border-radius: 50%;
        color: #d7c7ff;
        background: rgba(10, 8, 16, 0.92);
        border: 1px solid rgba(178, 92, 255, 0.85);
        box-shadow:
          0 0 0 4px rgba(5, 5, 8, 0.85),
          0 0 16px rgba(178, 92, 255, 0.35);
        pointer-events: none;
      }
      .eco-story-arrow.is-off {
        color: rgba(167, 139, 250, 0.55);
        border-color: rgba(167, 139, 250, 0.45);
        box-shadow: 0 0 0 4px rgba(5, 5, 8, 0.85);
      }
    </style>
  </head>
  <body>
    <div class="eco-story-flow">
      <div class="eco-story-node--supply">
        <div class="eco-story-node-visual">
          <div class="eco-supply-card is-lit is-active" data-shot="list">
            <div class="eco-supply-media" aria-hidden="true">
              <img class="eco-supply-shot" src="../public/media/supply-01.png" alt="" draggable="false" />
              <span class="eco-supply-orbit-pulse"></span>
            </div>
            <span class="eco-supply-status-pad"></span>
            <span class="eco-supply-status is-on">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
                <circle cx="10" cy="10" r="9" fill="currentColor" />
                <path
                  d="m6.2 10.2 2.4 2.4 5.2-5.2"
                  stroke="#120816"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="eco-supply-foot"></span>
            <a class="eco-supply-cta" href="#">Explore categories →</a>
          </div>
        </div>
        <i class="eco-story-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
            <path
              d="M8 12h8m0 0-3.2-3.2M16 12l-3.2 3.2"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </i>
      </div>
      <div class="eco-story-node--supply">
        <div class="eco-story-node-visual">
          <div class="eco-supply-card" data-shot="order">
            <div class="eco-supply-media" aria-hidden="true">
              <img class="eco-supply-shot" src="../public/media/supply-02.png" alt="" draggable="false" />
              <span class="eco-supply-orbit-pulse"></span>
            </div>
            <span class="eco-supply-status-pad"></span>
            <span class="eco-supply-status">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
                <circle cx="10" cy="10" r="8.2" stroke="currentColor" stroke-width="1.4" />
              </svg>
            </span>
            <span class="eco-supply-foot"></span>
            <a class="eco-supply-cta" href="#">Explore categories →</a>
          </div>
        </div>
        <i class="eco-story-arrow is-off" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none">
            <path
              d="M8 12h8m0 0-3.2-3.2M16 12l-3.2 3.2"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </i>
      </div>
      <div class="eco-story-node--supply">
        <div class="eco-story-node-visual">
          <div class="eco-supply-card" data-shot="receive">
            <div class="eco-supply-media" aria-hidden="true">
              <img class="eco-supply-shot" src="../public/media/supply-03.png" alt="" draggable="false" />
              <span class="eco-supply-orbit-pulse"></span>
            </div>
            <span class="eco-supply-status-pad"></span>
            <span class="eco-supply-status">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
                <circle cx="10" cy="10" r="8.2" stroke="currentColor" stroke-width="1.4" />
              </svg>
            </span>
            <span class="eco-supply-foot"></span>
            <a class="eco-supply-cta" href="#">Explore categories →</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
